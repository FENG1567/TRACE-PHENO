name: public-reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .
      - run: python scripts/reproduce_public.py
      - run: python scripts/verify_checksums.py
      - uses: actions/upload-artifact@v4
        with:
          name: trace-pheno-public-reproduction
          path: artifacts/
