[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-pheno"
version = "0.1.0"
description = "Public reproducibility package for auditable computable phenotyping"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "TRACE-PHENO contributors"}]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "matplotlib>=3.8,<4"
]

[project.scripts]
trace-pheno = "trace_pheno.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

